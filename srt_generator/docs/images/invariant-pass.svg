<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-label="Before and after comparison of entries 8, 9 and 10 of AgainsMyself.srt. Before the pass, entry 9 opens inside entry 8 and the two overlap by 0.19 seconds. After the pass, entry 8 keeps its edges because its end is already at the minimum duration, so entry 9's start is pushed forward by 0.21 seconds instead, and entry 10 is capped at five seconds.">
  <title>How the invariant pass repairs an overlap</title>

  <defs>
    <marker id="ar-struct" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#136B77"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="250" fill="#F1F3F2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#121A20">

    <text x="20" y="74" fill="#5A6B73">before</text>
    <text x="20" y="165" fill="#5A6B73">after</text>

    <!-- before -->
    <rect x="173" y="44" width="92" height="22" fill="#E6EAE9" stroke="#B3BFBE"/>
    <text x="219" y="59" text-anchor="middle">8</text>

    <rect x="178" y="74" width="152" height="22" fill="#E6EAE9" stroke="#B3BFBE"/>
    <text x="254" y="89" text-anchor="middle">9</text>

    <!-- the overlap, tinted over both bars -->
    <rect x="178" y="44" width="87" height="52" fill="#9E3A50" fill-opacity="0.16"/>
    <line x1="178" y1="40" x2="178" y2="100" stroke="#9E3A50" stroke-width="1" stroke-dasharray="3 2"/>
    <line x1="265" y1="40" x2="265" y2="100" stroke="#9E3A50" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="221" y="34" text-anchor="middle" fill="#9E3A50">overlap 0.19 s</text>

    <rect x="583" y="74" width="232" height="22" fill="#E6EAE9" stroke="#B3BFBE"/>
    <text x="600" y="89">10</text>
    <polygon points="818,74 830,85 818,96" fill="#B3BFBE"/>
    <text x="836" y="89" fill="#5A6B73">29.82</text>

    <!-- the repair -->
    <text x="173" y="120" fill="#5A6B73">entry 8 is already at min 0.2 s — its end cannot be shaved</text>
    <path d="M 178 134 H 271" fill="none" stroke="#136B77" stroke-width="1.3" marker-end="url(#ar-struct)"/>
    <text x="279" y="138" fill="#136B77">so entry 9's start is pushed +0.21 s instead</text>

    <!-- after -->
    <rect x="173" y="150" width="92" height="22" fill="#F5E7CE" stroke="#A96A06"/>
    <text x="219" y="165" text-anchor="middle" fill="#A96A06">8</text>

    <rect x="275" y="150" width="92" height="22" fill="#F5E7CE" stroke="#A96A06"/>
    <text x="321" y="165" text-anchor="middle" fill="#A96A06">9</text>

    <rect x="583" y="150" width="232" height="22" fill="#F5E7CE" stroke="#A96A06"/>
    <text x="600" y="165" fill="#A96A06">10</text>
    <polygon points="818,150 830,161 818,172" fill="#A96A06"/>
    <text x="836" y="165" fill="#A96A06">27.76</text>

    <!-- time axis -->
    <line x1="90" y1="200" x2="850" y2="200" stroke="#B3BFBE" stroke-width="1"/>
    <g text-anchor="middle" fill="#5A6B73">
      <line x1="136" y1="200" x2="136" y2="205" stroke="#B3BFBE"/><text x="136" y="220">21.6</text>
      <line x1="229" y1="200" x2="229" y2="205" stroke="#B3BFBE"/><text x="229" y="220">21.8</text>
      <line x1="321" y1="200" x2="321" y2="205" stroke="#B3BFBE"/><text x="321" y="220">22.0</text>
      <line x1="414" y1="200" x2="414" y2="205" stroke="#B3BFBE"/><text x="414" y="220">22.2</text>
      <line x1="506" y1="200" x2="506" y2="205" stroke="#B3BFBE"/><text x="506" y="220">22.4</text>
      <line x1="599" y1="200" x2="599" y2="205" stroke="#B3BFBE"/><text x="599" y="220">22.6</text>
      <line x1="691" y1="200" x2="691" y2="205" stroke="#B3BFBE"/><text x="691" y="220">22.8</text>
      <line x1="784" y1="200" x2="784" y2="205" stroke="#B3BFBE"/><text x="784" y="220">23.0 s</text>
    </g>

  </g>
</svg>
