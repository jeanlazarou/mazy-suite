<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="Timeline showing an aligner region stretched from 1 to 8 seconds, where the next line's singing begins, while this line is sung only from 1 to 2 seconds. A five-second search cap at 6 seconds bounds where the energy gate may look, so the trimmed region closes at 2.12 seconds instead of staying open to 8.">
  <title>Bounding the energy gate's search with --max-duration</title>

  <rect x="0" y="0" width="880" height="330" fill="#F1F3F2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#121A20">

    <!-- vocal energy -->
    <text x="70" y="34" fill="#5A6B73">vocal stem · RMS per 20 ms frame</text>
    <text x="716" y="44" text-anchor="middle" fill="#5A6B73">next line</text>
    <line x1="716" y1="50" x2="716" y2="60" stroke="#B3BFBE" stroke-width="1"/>

    <polyline points="70,118 138,118 146,96 157,88 169,70 180,80 192,64 203,84 214,98 222,116 230,118 670,118 678,94 693,74 708,66 724,82 739,72 754,116 762,118 830,118"
              fill="none" stroke="#A96A06" stroke-width="1.6"/>
    <line x1="70" y1="120" x2="830" y2="120" stroke="#D2D9D8" stroke-width="1"/>
    <line x1="70" y1="112" x2="830" y2="112" stroke="#9E3A50" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="300" y="106" fill="#9E3A50">−40 dB of peak — everything below is silence</text>

    <!-- what the aligner claimed -->
    <text x="146" y="144" fill="#9E3A50">aligner region  1.00 → 8.00</text>
    <rect x="146" y="150" width="532" height="22" fill="#F6E1E4" stroke="#9E3A50"/>

    <!-- the cap -->
    <line x1="526" y1="40" x2="526" y2="252" stroke="#5A6B73" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="532" y="54" fill="#5A6B73">start + 5 s cap</text>

    <!-- the bounded search window -->
    <path d="M 146 182 V 192 H 526 V 182" fill="none" stroke="#5A6B73" stroke-width="1"/>
    <text x="336" y="207" text-anchor="middle" fill="#5A6B73">frames the gate is allowed to search</text>

    <!-- the result -->
    <line x1="222" y1="120" x2="231" y2="218" stroke="#A96A06" stroke-width="1" stroke-dasharray="2 3"/>
    <rect x="146" y="222" width="85" height="22" fill="#F5E7CE" stroke="#A96A06"/>
    <text x="243" y="238" fill="#A96A06">trimmed region  1.00 → 2.12</text>

    <!-- time axis -->
    <line x1="70" y1="272" x2="830" y2="272" stroke="#B3BFBE" stroke-width="1"/>
    <g text-anchor="middle" fill="#5A6B73">
      <line x1="70"  y1="272" x2="70"  y2="277" stroke="#B3BFBE"/><text x="70"  y="292">0</text>
      <line x1="146" y1="272" x2="146" y2="277" stroke="#B3BFBE"/><text x="146" y="292">1</text>
      <line x1="222" y1="272" x2="222" y2="277" stroke="#B3BFBE"/><text x="222" y="292">2</text>
      <line x1="298" y1="272" x2="298" y2="277" stroke="#B3BFBE"/><text x="298" y="292">3</text>
      <line x1="374" y1="272" x2="374" y2="277" stroke="#B3BFBE"/><text x="374" y="292">4</text>
      <line x1="450" y1="272" x2="450" y2="277" stroke="#B3BFBE"/><text x="450" y="292">5</text>
      <line x1="526" y1="272" x2="526" y2="277" stroke="#B3BFBE"/><text x="526" y="292">6</text>
      <line x1="602" y1="272" x2="602" y2="277" stroke="#B3BFBE"/><text x="602" y="292">7</text>
      <line x1="678" y1="272" x2="678" y2="277" stroke="#B3BFBE"/><text x="678" y="292">8</text>
      <line x1="754" y1="272" x2="754" y2="277" stroke="#B3BFBE"/><text x="754" y="292">9</text>
      <line x1="830" y1="272" x2="830" y2="277" stroke="#B3BFBE"/><text x="830" y="292">10 s</text>
    </g>

    <!-- legend -->
    <line x1="70" y1="314" x2="94" y2="314" stroke="#A96A06" stroke-width="1.6"/>
    <text x="102" y="318" fill="#5A6B73">vocal energy</text>
    <rect x="196" y="308" width="24" height="11" fill="#F6E1E4" stroke="#9E3A50"/>
    <text x="228" y="318" fill="#5A6B73">what the aligner claimed</text>
    <rect x="400" y="308" width="24" height="11" fill="#F5E7CE" stroke="#A96A06"/>
    <text x="432" y="318" fill="#5A6B73">what the gate kept</text>

  </g>
</svg>
